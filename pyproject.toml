[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant-agentic"
version = "0.1.0"
description = "Agentic second-brain backed by claude -p with vault-scoped tool access. Successor to personal-assistant (deterministic kernel)."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jason Chi" }]
dependencies = [
  "python-telegram-bot ~= 21.0",
  "pyyaml >= 6.0, < 7.0",
  "pydantic ~= 2.0",
  "tenacity >= 8.0, < 10.0",
  "python-dotenv >= 1.0, < 2.0",
]

[project.optional-dependencies]
dev = [
  "pytest >= 8.0, < 9.0",
  "pytest-mock >= 3.10, < 4.0",
  "pytest-asyncio >= 0.23, < 1.0",
]

[tool.setuptools.packages.find]
include = ["agent*"]
exclude = ["tests*", "vault*", "eval*", "prompts*", "infra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
asyncio_mode = "auto"
